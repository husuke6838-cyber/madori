let madPlan=0;
const timeline=[
  {date:'2026/05/20',title:'初回相談（○○工務店・田中さん）',mine:'予算と希望の広さ、ZEH希望を伝えた',theirs:'30坪なら概算2,000万円前後と説明。次回プラン提案',future:false},
  {date:'2026/05/28',title:'プラン提案の打ち合わせ',mine:'対面キッチンと土間収納を再確認',theirs:'間取り案を3パターン用意すると回答',future:false},
  {date:'2026/06/10',title:'間取り案の確認（予定）',mine:'',theirs:'',future:true},
];
let current='ldk', view='edit', madSel=-1, sortStar=false;

function total(it){return members.reduce((s,m)=>s+(it.r?.[m.id]||0),0);}
function lvl(it){const a=total(it)/Math.max(members.length,1);return a>=2.5?'lvl-hi':a>=1.5?'lvl-mid':'';}
function memCls(m){return m.cls||'';}
function memRow(){let h=members.map(m=>`<span class="mc ${memCls(m)}"><span class="d"></span><span class="nm" contenteditable onblur="rename('${m.id}',this.textContent)">${m.name}</span>${members.length>1?`<button class="x" onclick="delMem('${m.id}')">×</button>`:''}</span>`).join('');h+=`<button class="mc-add" onclick="addMem()">＋ 家族</button>`;return `<div class="memrow">${h}</div>`;}
function tabRow(){return `<div class="tabrow">${project.rooms.map(r=>`<button class="tab ${r.id===current?'on':''} ${(r.items.length||r.naDone)?'has':''}" onclick="sel('${r.id}')"><span class="cb"></span>${r.name}</button>`).join('')}</div>`;}
function starsHTML(rid,idx,m,val){let s='';for(let n=1;n<=3;n++)s+=`<span class="star ${n<=val?'on':''}" onclick="setStar('${rid}',${idx},'${m.id}',${n})">★</span>`;return s;}
function rate(rid,idx,it){return `<div class="crate">${members.map(m=>`<div class="rr ${memCls(m)}"><span class="who">${m.name}</span><span class="stars">${starsHTML(rid,idx,m,it.r?.[m.id]||0)}</span></div>`).join('')}</div>`;}
function attach(rid,idx,it){let h='<div class="attach">';if(it.imgs>0){h+='<div class="thumbs">';for(let i=0;i<it.imgs;i++)h+='<div class="thumb">🖼 写真</div>';h+='</div>';}(it.links||[]).forEach(l=>{h+=`<div class="reflink"><div class="img">${l.ic}</div><div class="meta"><div class="t">${l.title}</div><div class="s">${l.site}</div></div></div>`;});h+=`<button class="addref" onclick="addRef('${rid}',${idx})">＋ 参考リンク・写真</button></div>`;return h;}
function itemCard(rid,idx,it){
  const prev=(it.prev||[]).map(p=>`<div class="prevline">${p}</div>`).join('');
  const tag=(it.prev&&it.prev.length)?'<span class="revtag">変更あり</span>':'';
  return `<div class="card ${lvl(it)}">${prev}<div class="ctext">${it.text}${tag}</div>${rate(rid,idx,it)}${attach(rid,idx,it)}${it.memo?`<div class="memo">${it.memo}</div>`:''}</div>`;
}
function editView(){
  const r=project.rooms.find(x=>x.id===current);
  let head=`<div class="rhead"><span class="rt mincho">${r.name}</span>${r.jou?`<span class="sizechip">希望 ${r.jou}帖</span>`:''}<button class="sortbtn ${sortStar?'on':''}" onclick="toggleSort()">★順</button></div>`;
  head+=`<div class="rsub">${r.sub||'理想を書きためよう'}</div>`;
  let c='';
  if(r.regret)c+=`<div class="regret"><span class="ri">💡</span><span><b>よくある後悔ポイント</b>${r.regret}</span></div>`;
  let items=r.items.map((it,i)=>({it,i}));
  if(sortStar)items.sort((a,b)=>total(b.it)-total(a.it));
  if(r.items.length)c+=items.map(o=>itemCard(r.id,o.i,o.it)).join('');
  else if(!r.naDone)c+='<div class="empty">まだ要望がありません。下のヒントから気になるものをタップ ✏️</div>';
  c+=`<div class="nacheck ${r.naDone?'on':''}" onclick="toggleNa('${r.id}')"><span class="box">${r.naDone?'✓':''}</span>この場所は特に要望なし（確認済み）</div>`;
  c+=`<div class="hintlbl">こんな項目はどう？（タップで追加）</div><div class="hrow">${r.hints.map(h=>`<button class="hc" onclick="addHint('${h}')">＋ ${h}</button>`).join('')}</div>`;
  return memRow()+tabRow()+`<div class="content">${head}${c}</div>`;
}
function starText(v){return '★'.repeat(v)+'☆'.repeat(3-v);}
function docView(){
  let h=`<div class="doc"><div class="doc-h mincho">家づくり計画書</div><div class="doc-sub">${project.name}　／　${new Date().toLocaleDateString('ja-JP')}時点</div><div class="doc-leg">${members.map(m=>`<span style="color:${m.cls==='w'?'#a13c63':'#39617c'}">■ ${m.name}</span>`).join('')}</div>`;
  project.rooms.forEach(r=>{
    if(!r.items.length)return;
    h+=`<div class="doc-room"><h2>${r.name}${r.jou?` <span style="font-size:11px;color:var(--ink-soft)">希望${r.jou}帖</span>`:''}</h2>`;
    [...r.items].sort((a,b)=>total(b)-total(a)).forEach(it=>{
      const st=members.map(m=>`<span style="color:${m.cls==='w'?'#a13c63':'#39617c'}"><b>${m.name}</b>${starText(it.r?.[m.id]||0)}</span>`).join('');
      const lk=(it.links||[]).map(l=>`<br><span style="color:var(--clay);font-size:11px">🔗 ${l.title}</span>`).join('');
      h+=`<div class="di"><div class="di-st">${st}</div><div class="di-t">${it.text}${it.memo?`<br><span style="color:var(--ink-soft);font-size:11px">${it.memo}</span>`:''}${lk}</div></div>`;
    });
    h+='</div>';
  });
  h+=`<div class="docbtns"><button class="b-print" onclick="return false">🖨 プリント</button><button class="b-mail" onclick="return false">✉️ メールで送る</button></div>`;
  h+=`<div class="nudge"><b>家づくり、始めたばかりですか？</b>複数の住宅会社のプランを無料で取り寄せて比べられます<br><a href="#" onclick="return false">資料請求してみる</a></div></div>`;
  return h;
}
function madoriView(){
  const jt=project.rooms.reduce((s,r)=>s+(r.jou||0),0);
  const liveT=(jt/2);const floorT=Math.round(liveT*1.35);
  const cl=Math.round(floorT*70/10)*10, ch=Math.round(floorT*90/10)*10;
  const plan=floorplans[madPlan].plan;
  // 間取り切替バー（最大5個）
  let ptabs=floorplans.map((f,i)=>`<button class="ptab ${i===madPlan?'on':''}" onclick="selPlan(${i})">${f.name}</button>`).join('');
  if(floorplans.length<5)ptabs+=`<button class="ptab add" onclick="addPlan()">＋</button>`;
  else ptabs+=`<span class="ptab max">最大5個</span>`;
  const rms=plan.map((p,i)=>`<div class="rm ${i===madSel?'sel':''}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px" onclick="madTap(${i})"><span class="rl">${p.l}</span>${p.j?`<span class="rj">${p.j}</span>`:''}</div>`).join('');
  const wins=`<div class="win" style="left:80px;top:-3px;width:46px;height:5px"></div><div class="win" style="left:236px;top:-3px;width:40px;height:5px"></div><div class="win" style="left:-3px;top:90px;width:5px;height:50px"></div>`;
  const tools=[['＋','部屋'],['🚪','開き戸'],['🚪↔','引き戸'],['▭','窓'],['🪜','階段'],['🍳','キッチン'],['🛁','設備']].map(t=>`<button class="tool"><span class="ti">${t[0]}</span>${t[1]}</button>`).join('');
  return `<div class="mad-head"><div class="rt mincho">間取りデザイン</div><div class="rsub">マス目に部屋を置いて、理想の間取りを2Dで描く</div></div>
   <div class="ptabrow">${ptabs}<button class="pdup" onclick="dupPlan()">⧉ 複製</button></div>
   <div class="summary">
     <div class="srow"><span class="sk">要望サイズの合計（居室）</span><b>${jt}帖 / 約${liveT}坪</b></div>
     <div class="srow"><span class="sk">延床の目安（廊下・水回り込み）</span><b>約${floorT}坪</b></div>
     <div class="srow"><span class="sk">概算建築費</span><b>約${cl.toLocaleString()}〜${ch.toLocaleString()}万円</b></div>
     <div class="srow"><span class="sk">固定資産税 初年度の目安</span><b>年 約8〜13万円</b></div>
     <div class="cap">※マス目からの超概算です。坪単価70〜90万円で試算。実際の費用・税額は仕様・地域・軽減措置で大きく変わります</div>
   </div>
   <div class="plan">${rms}${wins}</div>
   <div class="palette"><div class="pcap">「${floorplans[madPlan].name}」を編集中／部屋・扉・設備をタップして配置できます</div><div class="tools">${tools}</div></div>`;
}
function kirokuView(){
  let h=`<div class="tl"><div class="rt mincho" style="margin-bottom:4px">打ち合わせの記録</div><div class="rsub">いつ・何を話したか・担当の方の回答をタイムラインで残す</div><button class="tl-add" onclick="return false">＋ 記録を追加</button>`;
  timeline.forEach(t=>{
    h+=`<div class="tlitem ${t.future?'future':''}"><span class="dot"></span><div class="tldate">${t.date}</div><div class="tltitle">${t.title}</div>`;
    if(!t.future)h+=`<div class="tlbox"><div class="mine"><span class="lab">伝えたこと</span><br>${t.mine}</div><div class="theirs"><span class="lab">担当の方の回答</span><br>${t.theirs}</div></div>`;
    h+=`</div>`;
  });
  return h+'</div>';
}
function render(){const v=view;document.getElementById('scroll').innerHTML = v==='edit'?editView():v==='doc'?docView():v==='madori'?madoriView():kirokuView();}
function setView(v){view=v;['Edit','Doc','Mad','Kir'].forEach(s=>document.getElementById('nav'+s).classList.remove('on'));
  document.getElementById({edit:'navEdit',doc:'navDoc',madori:'navMad',kiroku:'navKir'}[v]).classList.add('on');
  document.getElementById('fab').style.display=v==='edit'?'grid':'none';render();}
function sel(id){current=id;render();}
function madTap(i){madSel=(madSel===i?-1:i);render();}
function selPlan(i){madPlan=i;madSel=-1;render();}
function addPlan(){if(floorplans.length>=5)return;floorplans.push({name:'案'+String.fromCharCode(65+floorplans.length),plan:[]});madPlan=floorplans.length-1;madSel=-1;render();}
function dupPlan(){if(floorplans.length>=5)return;const src=floorplans[madPlan];floorplans.push({name:src.name+' のコピー',plan:JSON.parse(JSON.stringify(src.plan))});madPlan=floorplans.length-1;render();}
function toggleSort(){sortStar=!sortStar;render();}
function toggleNa(id){const r=project.rooms.find(x=>x.id===id);r.naDone=!r.naDone;render();}
function setStar(rid,idx,mid,val){const it=project.rooms.find(x=>x.id===rid).items[idx];if(!it.r)it.r={};it.r[mid]=(it.r[mid]===val)?val-1:val;render();}
function addHint(t){const r=project.rooms.find(x=>x.id===current);const r0={};members.forEach(m=>r0[m.id]=0);r.items.push({text:t||'（タップして入力）',r:r0,links:[],imgs:0});if(r.naDone)r.naDone=false;render();}
function addRef(rid,idx){const it=project.rooms.find(x=>x.id===rid).items[idx];if(!it.links)it.links=[];it.links.push(refPool[it.links.length%refPool.length]);render();}
function addMem(){const i=members.length;members.push({id:'m'+i,name:suggestNames[i-2]||('メンバー'+(i+1)),cls:''});render();}
function delMem(id){members=members.filter(m=>m.id!==id);render();}
function rename(id,n){const m=members.find(x=>x.id===id);if(m)m.name=n.trim()||m.name;}
render();
</script>
</body>
</html>
